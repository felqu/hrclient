[project]
name = "hrclient-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29", "aiosqlite>=0.20", "alembic>=1.13", "pydantic-settings>=2.5", "httpx>=0.27", "celery[redis]>=5.4",
  "python-multipart>=0.0.9", "jinja2>=3.1", "pdfplumber>=0.11", "python-docx>=1.1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
